[project]
name = "ontology-for-fashion-cymbal"
version = "0.1.0"
description = "OKF + Knowledge Catalog + ADK agent demo for fashion retail analytics"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "google-cloud-dataplex>=2.5.0",
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-resource-manager>=1.12.0",
    "google-adk>=1.2.0",
    "google-genai>=1.0.0",
    "python-frontmatter>=1.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["agent*"]
